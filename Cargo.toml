[package]
name = "spotify-ripper"
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
description = "A small ripper for Spotify that rips Spotify URIs to media files"
license = "MIT"
authors = ["Simone Caronni <negativo17@gmail.com>"]
repository = "https://github.com/scaronni/spotify-ripper"
readme = "README.md"
keywords = ["spotify", "ripper", "mp3", "flac", "opus"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["string"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
http = "1.5.0"
libc = "0.2.190"
librespot-audio = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-core = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-discovery = { version = "0.8.0", default-features = false, features = ["native-tls", "with-libmdns"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-protocol = "0.8.0"
lofty = "0.24.0"
log = "0.4.34"
protobuf = "3"
regex = "1.13.1"
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-normalization = "0.1.25"

# Development snapshot matching the rust-librespot package.
[patch.crates-io]
librespot-audio = { git = "https://github.com/librespot-org/librespot", rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d" }
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d" }
librespot-discovery = { git = "https://github.com/librespot-org/librespot", rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d" }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "e023adbbf017ae1fc10d01531dbe50c409786f2d" }

[profile.release]
lto = true
