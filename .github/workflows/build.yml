name: build

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/spotify-ripper dist/spotify-ripper-${{ matrix.arch }}-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-ripper-${{ matrix.arch }}-linux
          path: dist/spotify-ripper-${{ matrix.arch }}-linux
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          pattern: spotify-ripper-*-linux
          path: dist
          merge-multiple: true

      - name: Create release and attach the binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spotify-ripper-*-linux
          generate_release_notes: true
